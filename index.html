<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Earclacks - History</title>
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body class="page">
    <div id="topNav">
      <div class="nav-left">
        <div class="logo">⚔️ Earclacks</div>
        <div class="game-name">History</div>
      </div>
      <div class="nav-right">
        <button id="newGameFromHome" class="btn btn-primary">+ New Game</button>
        <button id="openGame" class="btn btn-secondary">🎮 Open Game</button>
        <button id="clearHistory" class="btn btn-danger">🗑️ Clear History</button>
      </div>
    </div>

    <div class="page-shell">
      <div class="page-card">
        <div class="page-card-header">
          <h3 style="margin:0">📜 Game History</h3>
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
            <span class="stat-display">
              <span class="stat-label">Games:</span>
              <span class="stat-value" id="gamesCount">0</span>
            </span>
          </div>
        </div>
        <div class="page-card-body">
          <div id="gamesList" class="games-list"></div>
        </div>
      </div>
    </div>

    <!-- Mode selection modal -->
    <div id="modeModal" class="modal">
      <div class="modal-overlay"></div>
      <div class="modal-container">
        <div class="modal-header">
          <h2>🎮 Select Mode</h2>
          <button class="modal-close" id="closeMode">&times;</button>
        </div>
        <div class="modal-body">
          <div style="display:flex;gap:10px;flex-wrap:wrap">
            <button class="btn btn-primary" data-mode="sandbox">Sandbox</button>
            <button class="btn btn-secondary" data-mode="battle_royale">Battle Royale</button>
          </div>
          <div class="info-box" style="margin-top:12px">
            Battle Royale: last tank alive gets FIRST PLACE (auto-pauses at 1 remaining).
          </div>
        </div>
      </div>
    </div>

    <script src="src/history.js"></script>
  </body>
</html>
